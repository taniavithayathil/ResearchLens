version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: researchlens_db
    environment:
      POSTGRES_USER: researchlens
      POSTGRES_PASSWORD: researchlens_password
      POSTGRES_DB: researchlens_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: researchlens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
